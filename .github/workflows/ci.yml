name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Required status checks must report even on docs-only PRs. A small detector
# runs first; skipping entire workflows with paths-ignore would block merging.
jobs:
  changes:
    name: Determine whether CI is needed
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_ci: ${{ steps.filter.outputs.run_ci }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check changed files
        id: filter
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci-needed.py >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run_ci != 'false') }}
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # rustydocs reads git history (blame/log); tests need the full clone.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.21'

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

  lint:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run_ci != 'false') }}
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # golangci-lint v2 needs a recent toolchain; the build/test matrix stays on 1.21.
          go-version: '1.26'

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Code is not formatted. Run 'gofmt -w .'"
            gofmt -d .
            exit 1
          fi

  release-snapshot:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run_ci != 'false') }}
    name: Validate release snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: amd64,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          install-only: true

      - name: Check configuration and build snapshot
        run: |
          goreleaser check
          make release

      - name: Verify archive checksums
        working-directory: dist
        run: sha256sum --check checksums.txt

      - name: Test container scans on both architectures
        run: |
          RUSTYDOCS_EXPECTED_VERSION="$(jq -r .version dist/metadata.json)"
          RUSTYDOCS_EXPECTED_COMMIT="$(git rev-parse HEAD)"
          export RUSTYDOCS_EXPECTED_VERSION RUSTYDOCS_EXPECTED_COMMIT
          image="ghcr.io/nrynss/rustydocs:$RUSTYDOCS_EXPECTED_VERSION"
          python3 scripts/test-container.py "$image-amd64" linux/amd64
          python3 scripts/test-container.py "$image-arm64" linux/arm64
