name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  actions: read

# Serialize publishers of the shared latest tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release with GoReleaser
    runs-on: ubuntu-latest
    steps:
      - name: Require successful CI for the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for _ in {1..60}; do
            ci=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&branch=main&per_page=100" --jq '.workflow_runs | max_by(.run_number) | {id, status, conclusion}')
            run_id=$(jq -r '.id // empty' <<< "$ci")
            if [ -z "$run_id" ]; then
              echo "No push-to-main CI run exists for $GITHUB_SHA. Tag a commit checked by CI."
              exit 1
            fi
            status=$(jq -r '.status' <<< "$ci")
            if [ "$status" = completed ]; then
              conclusion=$(jq -r '.conclusion' <<< "$ci")
              if [ "$conclusion" != success ]; then
                echo "CI run $run_id concluded $conclusion; refusing to publish."
                exit 1
              fi
              echo "CI run $run_id passed for $GITHUB_SHA; proceeding with publication."
              exit 0
            fi
            echo "Waiting for CI run $run_id ($status)..."
            sleep 30
          done
          echo "Timed out waiting for CI; refusing to publish."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: amd64,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
